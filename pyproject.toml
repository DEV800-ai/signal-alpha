[project]
name = "signalalpha"
version = "0.1.0"
description = "Personal research engine: detect early signals, validate via backtest before acting."
requires-python = ">=3.12,<3.14"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=2.0",
    "yfinance>=0.2.50",
    "lxml>=5.0",
    "requests>=2.32",
    "scipy>=1.13",
    "tqdm>=4.66",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "python-multipart>=0.0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signalalpha"]

[tool.ruff]
line-length = 100
target-version = "py312"

