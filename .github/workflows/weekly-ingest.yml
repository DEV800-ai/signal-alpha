name: Scheduled ingest (3× daily, Mon–Fri)

on:
  schedule:
    - cron: "20 13 * * 1-5"  # 09:20 ET — before market open
    - cron: "0 17 * * 1-5"   # 13:00 ET — midday
    - cron: "45 20 * * 1-5"  # 16:45 ET — after market close
  workflow_dispatch:       # Allow manual trigger from GitHub UI

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Trigger ingestion + signal re-run
        run: |
          response=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}" \
            "https://signal-alpha-production.up.railway.app/admin/ingest")

          cat /tmp/response.json
          echo ""

          if [ "$response" != "200" ]; then
            echo "ERROR: ingest endpoint returned HTTP $response"
            exit 1
          fi

          echo "Ingest triggered — waiting 10 minutes for signals to complete..."
          sleep 600

      - name: Take rotation snapshot
        run: |
          response=$(curl -s -o /tmp/snap.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}" \
            "https://signal-alpha-production.up.railway.app/admin/snapshot")

          cat /tmp/snap.json
          echo ""

          if [ "$response" != "200" ]; then
            echo "ERROR: snapshot endpoint returned HTTP $response"
            exit 1
          fi

          echo "Snapshot complete."

      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_PASSWORD }}
          subject: "SignalAlpha — ingest job failed (${{ github.run_id }})"
          to: pinto2004@gmail.com
          from: SignalAlpha Actions <${{ secrets.GMAIL_USER }}>
          body: |
            The scheduled SignalAlpha ingest job failed.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Check the logs above for details. You may need to manually trigger the ingest
            or upload a fresh DB to Railway.
