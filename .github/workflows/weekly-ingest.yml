name: Scheduled ingest (3× daily, Mon–Fri)

on:
  schedule:
    - cron: "20 13 * * 1-5"  # 09:20 ET — before market open
    - cron: "0 17 * * 1-5"   # 13:00 ET — midday
    - cron: "45 20 * * 1-5"  # 16:45 ET — after market close
  workflow_dispatch:       # Allow manual trigger from GitHub UI

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Trigger ingestion + signal re-run
        run: |
          response=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}" \
            "https://signal-alpha-production.up.railway.app/admin/ingest")

          cat /tmp/response.json
          echo ""

          if [ "$response" != "200" ]; then
            echo "ERROR: ingest endpoint returned HTTP $response"
            exit 1
          fi

          echo "Ingest triggered — waiting 10 minutes for signals to complete..."
          sleep 600

      - name: Take rotation snapshot
        run: |
          response=$(curl -s -o /tmp/snap.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}" \
            "https://signal-alpha-production.up.railway.app/admin/snapshot")

          cat /tmp/snap.json
          echo ""

          if [ "$response" != "200" ]; then
            echo "ERROR: snapshot endpoint returned HTTP $response"
            exit 1
          fi

          echo "Snapshot complete."

      - name: Verify data freshness
        run: |
          response=$(curl -s -o /tmp/health.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}" \
            "https://signal-alpha-production.up.railway.app/admin/health")

          echo "Health check response (HTTP $response):"
          cat /tmp/health.json
          echo ""

          if [ "$response" != "200" ]; then
            echo "ERROR: health endpoint returned HTTP $response"
            exit 1
          fi

          python3 -c "import json,datetime,sys; d=json.load(open('/tmp/health.json')); lp=d.get('last_price_date',''); print('Last price date in DB:', lp); today=datetime.date.today(); ltd=next(today-datetime.timedelta(days=i) for i in range(5) if (today-datetime.timedelta(days=i)).weekday()<5); ok={today.strftime('%Y-%m-%d'),ltd.strftime('%Y-%m-%d')}; (print('ERROR: stale, expected one of', sorted(ok)) or sys.exit(1)) if lp not in ok else print('Data freshness check passed.')"

      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_PASSWORD }}
          subject: "SignalAlpha — ingest job failed (${{ github.run_id }})"
          to: pinto2004@gmail.com
          from: SignalAlpha Actions <${{ secrets.GMAIL_USER }}>
          body: |
            The scheduled SignalAlpha ingest job failed.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Check the Railway logs for ERROR lines from ingest_all, run_live_signals, or _snapshot_top10.
            Common causes: yfinance API change, DB volume issue, or rate limiting.

            You may need to manually trigger the ingest or upload a fresh DB to Railway.
